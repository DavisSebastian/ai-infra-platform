name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Formatting check (ruff format)
        run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true # reuse downloaded packages between runs

      - name: Set up Python
        run: uv python install

      # --locked fails the build if uv.lock is out of date, so CI always tests the exact pinned versions.
      # Only the "serve" group, not "week02": no torch, no GPU. The tests use a fake model.
      - name: Install dependencies
        run: uv sync --locked --group dev --group week02-serve

      - name: Run tests
        run: uv run pytest -v
