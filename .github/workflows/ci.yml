name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Formatting check (ruff format)
        run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true # reuse downloaded packages between runs

      - name: Set up Python
        run: uv python install

      # --locked fails the build if uv.lock is out of date, so CI always tests the exact pinned versions.
      # Only the "serve" group, not "week02": no torch, no GPU. The tests use a fake model.
      - name: Install dependencies
        run: uv sync --locked --group dev --group week02-serve

      - name: Run tests
        run: uv run pytest -v

  test-gateway:
    runs-on: ubuntu-latest

    # A service container: GitHub starts Redis next to the job, like the compose file does locally.
    # The rate limiter must be tested against a real Redis; a mock would not catch races or Lua mistakes.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379 # the job runs on the VM, so it reaches Redis at localhost:6379
        # Same healthcheck as docker-compose.yml, different syntax. GitHub waits for "healthy" before the steps run.
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 5

    env:
      REQUIRE_REDIS: "1" # tests that need Redis must fail, not skip, if it is missing

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      # Installs the gateway package (gateway/) and its dependencies, compiling promptclean on the way.
      - name: Install dependencies
        run: uv sync --locked --group dev --group week03-serve

      # The gateway is an installed package now, so `import gateway` works from anywhere: no pythonpath override.
      - name: Run gateway tests
        run: uv run pytest -v gateway/tests

  test-week04:
    # First build matrix: the same job on Linux (gcc, x86_64) and macOS (clang, arm64). Native code is compiled per
    # platform, so "it builds on my Mac" says nothing about Linux (what the Docker image runs), and vice versa.
    strategy:
      fail-fast: false # show both results even if one platform fails
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      # Installing the week04 group compiles promptclean's C++ (scikit-build-core runs CMake + the compiler).
      - name: Build promptclean and install dependencies
        run: uv sync --locked --group dev --group week04

      - name: Show the compiled module (platform-specific filename)
        run: uv run python -c "import promptclean._native as n; print(n.__file__)"

      - name: Run Week 4 tests
        run: uv run pytest -v week04-cpp-cleaner/tests
