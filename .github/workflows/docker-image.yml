name: Docker image

# Builds the Week 2 image for linux/amd64 (what RunPod GPUs run; a Mac builds arm64 by default).
#   pull request -> build only, to prove the Dockerfile still works. Nothing is published.
#   push to main -> build and publish to GitHub Container Registry (GHCR).
on:
  push:
    branches: [main]
    paths:
      - week02-thin-slice/**
      - pyproject.toml
      - uv.lock
      - .dockerignore
      - .github/workflows/docker-image.yml
  pull_request:
    branches: [main]
    # Same list as above. Skips this slow job when only docs or notes change.
    paths:
      - week02-thin-slice/**
      - pyproject.toml
      - uv.lock
      - .dockerignore
      - .github/workflows/docker-image.yml

jobs:
  build:
    runs-on: ubuntu-latest

    # Least privilege: this is the only workflow that may write packages. The lint and test jobs can't.
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # The runner has only about 14 GB free, and the CUDA image needs more than that while building.
      # Delete big toolchains we never use (.NET, Android SDK, Haskell).
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      # GHCR requires lowercase names, but the repo is "DavisSebastian/ai-infra-platform".
      - name: Work out the image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/week02-thin-slice" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # GITHUB_TOKEN is created fresh for every run and expires with it: no password stored anywhere.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: . # the repo root: the Dockerfile needs the root pyproject.toml and uv.lock
          file: week02-thin-slice/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          # Links the package to this repo in GHCR.
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          # Layer cache kept in the registry itself. Reinstalling torch takes minutes, so when only app code
          # changes we want to reuse that layer. (The GitHub Actions cache is capped at 10 GB; this image isn't.)
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: ${{ github.event_name == 'push' && format('type=registry,ref={0}:buildcache,mode=max', env.IMAGE) || '' }}
