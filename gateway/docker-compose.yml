# The gateway's dev stack (built in Week 3): gateway -> fake model servers, with Redis for rate limiting.
# Week 6: two fake model servers, blue (`fake`) and green (`fake-green`). The gateway starts all blue; move traffic
# with:  curl -X POST -H "X-Admin-Token: dev-token" -d '{"green": 10}' localhost:8080/admin/traffic
#
#   docker compose up -d --build --wait   build, start, and wait until every service is healthy
#   docker compose ps                     every STATUS should read "healthy"
#   curl -N localhost:8080/v1/chat/completions -H 'content-type: application/json' \
#        -d '{"messages":[{"role":"user","content":"hi"}],"stream":true}'
#   docker compose down
#
# Only `redis` (for tests running on the Mac) and `gateway` publish ports. The fake model server is reachable
# only inside the compose network, as http://fake:9000, which is how the gateway finds it.

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379" # Mac port : container port. Lets pytest on the Mac reach Redis at localhost:6379
    healthcheck:
      # Docker runs this inside the container. Exit code 0 means healthy.
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 5

  fake:
    # Same image as the gateway, different command: one build, two services.
    build:
      context: .. # the repo root, because the Dockerfile needs the root pyproject.toml and uv.lock
      dockerfile: gateway/Dockerfile
    image: gateway:dev
    command: ["uvicorn", "gateway.fake_upstream:app", "--host", "0.0.0.0", "--port", "9000"]
    environment:
      FAKE_NAME: blue # answers say "model": "blue", so you can see which side served a request
      FAKE_CHUNKS: "20"
      FAKE_CHUNK_DELAY: "0.02"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 10

  fake-green:
    # The same image again, named green: the "new version" Blue/Green moves traffic to.
    image: gateway:dev
    command: ["uvicorn", "gateway.fake_upstream:app", "--host", "0.0.0.0", "--port", "9000"]
    environment:
      FAKE_NAME: green
      FAKE_CHUNKS: "20"
      FAKE_CHUNK_DELAY: "0.02"
    depends_on:
      fake:
        condition: service_started # fake builds gateway:dev; this one only reuses it
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 10

  gateway:
    image: gateway:dev
    ports:
      - "8080:8080"
    environment:
      # Service names, not localhost: inside a container, localhost is the container itself.
      REDIS_URL: redis://redis:6379
      UPSTREAM_URL: http://fake:9000 # blue
      GREEN_URL: http://fake-green:9000
      TRAFFIC_GREEN: "0" # start all blue
      ADMIN_TOKEN: dev-token # local only; a real deployment reads it from a secret
      MAX_IN_FLIGHT: "1"
      MAX_QUEUE: "2"
      RATE_LIMIT_CAPACITY: "10"
      RATE_LIMIT_REFILL_PER_SEC: "1"
    depends_on:
      # Wait until these are HEALTHY (their healthchecks pass), not merely started.
      redis:
        condition: service_healthy
      fake:
        condition: service_healthy
      fake-green:
        condition: service_healthy
