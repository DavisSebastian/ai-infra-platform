[project]
name = "ai-infra-platform"
version = "0.1.0"
description = "AI infrastructure learning path + capstone benchmark suite"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.16.9",
    "pytest>=8",
    "pytest-asyncio>=0.24",  # lets tests be `async def`, needed to test an async server
    "httpx>=0.27",  # test client: real HTTP against an in-process server (fine for tests, too slow for load tests)
    "hypothesis>=6",  # property-based tests: generates thousands of inputs and shrinks failures (week 4)
]
week01 = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",  # [standard] pulls in uvloop + httptools
    "aiosqlite>=0.20",
    "aiohttp>=3.10",  # load-test client (httpx was measurably the bottleneck at c=100)
]
week02-serve = [
    # Everything the Week 2 server needs EXCEPT the model libraries. CI installs just this + dev (no torch).
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "anyio>=4",  # CancelScope(shield=True) for cleanup while a request is being cancelled
]
week02 = [
    {include-group = "week02-serve"},
    "aiohttp>=3.10",
    "torch>=2.4",
    "transformers>=4.45",
    "accelerate>=0.34",  # lets transformers place weights on the right device efficiently
]

week03-serve = [
    # Everything the Week 3 gateway needs. aiohttp and httpx are both here on purpose: step 1 measures which
    # one makes the better streaming proxy (the choice is the PROXY_CLIENT env var).
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "anyio>=4",
    "aiohttp>=3.10",
    "httpx>=0.27",
    "redis>=5",  # redis.asyncio: the async client, with a connection pool built in
    "promptclean",  # week 4: the C++ prompt cleaner (compiled on install; see week04-cpp-cleaner/)
]
week03 = [
    {include-group = "week03-serve"},
]

week04 = [
    # A separate package with a compiled C++ part. Installing it runs CMake + the C++ compiler (see
    # week04-cpp-cleaner/pyproject.toml). After changing the C++ code: uv sync --group week04 --reinstall-package promptclean
    "promptclean",
]

[tool.uv.sources]
promptclean = { path = "week04-cpp-cleaner" }

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes (unused imports/vars, undefined names)
    "I",  # isort (import sorting)
    "UP", # pyupgrade (modern syntax for the pinned Python version)
]

[tool.pytest.ini_options]
testpaths = ["week02-thin-slice/tests"]
pythonpath = ["week02-thin-slice"]  # so tests can `import app.main`
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
