[project]
name = "ai-infra-platform"
version = "0.1.0"
description = "AI infrastructure learning path + capstone benchmark suite"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.16.9",
    "pytest>=8",
    "pytest-asyncio>=0.24",  # lets tests be `async def`, needed to test an async server
    "httpx>=0.27",  # test client: real HTTP against an in-process server (fine for tests, too slow for load tests)
    "hypothesis>=6",  # property-based tests: generates thousands of inputs and shrinks failures (week 4)
]
week01 = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",  # [standard] pulls in uvloop + httptools
    "aiosqlite>=0.20",
    "aiohttp>=3.10",  # load-test client (httpx was measurably the bottleneck at c=100)
]
week02-serve = [
    # Everything the Week 2 server needs EXCEPT the model libraries. CI installs just this + dev (no torch).
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "anyio>=4",  # CancelScope(shield=True) for cleanup while a request is being cancelled
]
week02 = [
    {include-group = "week02-serve"},
    "aiohttp>=3.10",
    "torch>=2.4",
    "transformers>=4.45",
    "accelerate>=0.34",  # lets transformers place weights on the right device efficiently
]

week03-serve = [
    # The Week 3 gateway, now its own package in gateway/ (its runtime dependencies live in gateway/pyproject.toml).
    "gateway",
]
week03 = [
    {include-group = "week03-serve"},
]

week04 = [
    # A separate package with a compiled C++ part. Installing it runs CMake + the C++ compiler (see
    # week04-cpp-cleaner/pyproject.toml). After changing the C++ code: uv sync --group week04 --reinstall-package promptclean
    "promptclean",
]

week05-registry = [
    # Everything Week 5 needs EXCEPT the model libraries: release.py, the registering half of register.py, and the
    # CI registry check. CI installs just this (no torch), like week02-serve.
    # The MLflow server runs in Docker (week05-mlflow-registry/docker-compose.yml). Scripts only talk to it over
    # HTTP, so the client-only "skinny" package is enough. Pinned to the server's version: client and server
    # should match.
    "mlflow-skinny==3.17.2",
    "pyyaml>=6",
]
week05 = [
    {include-group = "week05-registry"},
    # register.py runs each card's model locally to score it (same libraries as Week 2).
    "torch>=2.4",
    "transformers>=4.45",
    "accelerate>=0.34",
]

week07-drift = [
    # The drift check WITHOUT the embedding model: Evidently's statistics, run on precomputed or stand-in
    # embeddings. CI installs just this (no torch), the same split as week05-registry.
    "evidently==0.7.23",
    # Upper bound on purpose: Evidently 0.7.23 imports a pandas internal (infer_dtype_from_object) that pandas 3
    # removed, so with pandas 3.x `import evidently` crashes. Lift this only after an Evidently release fixes it.
    "pandas>=2.2,<3",
    "pyarrow>=17",  # parquet files for the baseline and the captured windows
]
week07 = [
    {include-group = "week07-drift"},
    # Turns prompts into embeddings (all-MiniLM-L6-v2: 384 numbers per sentence, ~90 MB, runs on CPU).
    "sentence-transformers==6.3.0",
]

[tool.uv.sources]
promptclean = { path = "week04-cpp-cleaner" }
gateway = { path = "gateway", editable = true }  # editable: code edits apply without reinstalling

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes (unused imports/vars, undefined names)
    "I",  # isort (import sorting)
    "UP", # pyupgrade (modern syntax for the pinned Python version)
]

[tool.pytest.ini_options]
testpaths = ["week02-thin-slice/tests"]
pythonpath = ["week02-thin-slice"]  # so tests can `import app.main`
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
